<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #0077b6; font-family: 'Segoe UI', sans-serif; cursor: pointer; }
        canvas { display: block; background: linear-gradient(#90e0ef, #0077b6); }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; pointer-events: none; }
        .goal { font-size: 24px; font-weight: bold; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
    </style>
</head>
<body onclick="window.focus()">

<div id="ui">
    <div id="text" class="goal">Objetivo: Limpiar 10 plásticos (0/10)</div>
</div>
<canvas id="coralCanvas"></canvas>

<script>
const canvas = document.getElementById("coralCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let count = 0;
let currentItem = null;
const target = 10;
let win = false;

// Crea un solo objeto a la vez
function spawnItem() {
    if (!currentItem && !win) {
        currentItem = {
            x: 50 + Math.random() * (canvas.width - 100),
            y: -50,
            emoji: ['🥤', '🛍️', '🧴'][Math.floor(Math.random() * 3)],
            speed: 1.5 // Muy lento
        };
    }
}

canvas.addEventListener("mousedown", (e) => {
    if (!currentItem || win) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Área de clic gigante (100px) para que sea imposible fallar
    const dist = Math.hypot(mx - currentItem.x, my - currentItem.y);
    if (dist < 100) {
        count++;
        currentItem = null; // Desaparece y espera al siguiente
        document.getElementById("text").innerText = `Objetivo: Limpiar 10 plásticos (${count}/10)`;
        
        if (count >= target) {
            win = true;
            document.getElementById("text").innerHTML = "¡GRACIAS! <br> El coral está a salvo 🪸✨";
        }
    }
});

function update() {
    if (win) return;
    spawnItem();
    if (currentItem) {
        currentItem.y += currentItem.speed;
        // Si se sale, lo reseteamos para que siempre haya uno en pantalla
        if (currentItem.y > canvas.height + 50) currentItem = null;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // El Coral (objetivo visual)
    ctx.font = win ? "120px Arial" : "80px Arial";
    ctx.textAlign = "center";
    ctx.fillText(win ? "🪸" : "🥀", canvas.width / 2, canvas.height - 50);

    // El objeto actual
    if (currentItem) {
        ctx.font = "60px Arial";
        ctx.fillText(currentItem.emoji, currentItem.x, currentItem.y);
    }

    requestAnimationFrame(() => { update(); draw(); });
}
draw();
</script>
</body>
</html>
