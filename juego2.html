<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #a2d2ff; cursor: pointer; font-family: sans-serif; }
        canvas { display: block; background: linear-gradient(#caf0f8, #90e0ef, #00b4d8); }
        #msg { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #0077b6; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body onclick="window.focus()">

<div id="msg">¡Toca el plástico para limpiar el agua! ✨</div>
<canvas id="easyCanvas"></canvas>

<script>
const canvas = document.getElementById("easyCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let items = [];
let fish = [];
const trashEmojis = ['🧴', '🛍️', '🥤'];
const fishEmojis = ['🐠', '🐟', '🐡', '✨'];

// Crear basura lenta y grande
function createTrash() {
    if (Math.random() < 0.03) {
        items.push({
            x: Math.random() * (canvas.width - 50),
            y: canvas.height + 50,
            emoji: trashEmojis[Math.floor(Math.random() * trashEmojis.length)],
            speed: 0.5 + Math.random() * 1
        });
    }
}

// Al hacer clic: Limpiar y crear un pez
canvas.addEventListener("mousedown", (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    items.forEach((item, i) => {
        const dist = Math.hypot(mx - item.x, my - item.y);
        if (dist < 60) { // Margen de error enorme (muy fácil)
            // El plástico se convierte en pez
            fish.push({ x: item.x, y: item.y, emoji: fishEmojis[Math.floor(Math.random() * fishEmojis.length)], vx: (Math.random() - 0.5) * 4, vy: -2 });
            items.splice(i, 1);
        }
    });
});

function update() {
    createTrash();
    
    // Subir basura
    items.forEach(item => item.y -= item.speed);
    
    // Movimiento de los peces rescatados
    fish.forEach((f, i) => {
        f.x += f.vx;
        f.y += f.vy;
        if (f.y < -50) fish.splice(i, 1);
    });

    // Limpiar basura que se escapa (sin penalización)
    items = items.filter(item => item.y > -50);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.font = "50px Arial";
    items.forEach(item => ctx.fillText(item.emoji, item.x, item.y));
    
    ctx.font = "40px Arial";
    fish.forEach(f => ctx.fillText(f.emoji, f.x, f.y));

    requestAnimationFrame(() => { update(); draw(); });
}
draw();
</script>
</body>
</html>
