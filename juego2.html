<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #005f73; font-family: 'Arial', sans-serif; cursor: none; }
        canvas { display: block; background: linear-gradient(to right, #0a9396, #005f73); }
        #ui { 
            position: absolute; top: 10px; width: 100%; 
            display: flex; justify-content: space-around; 
            color: #e9d8a6; font-weight: bold; pointer-events: none; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-size: 20px;
        }
    </style>
</head>
<body onclick="window.focus()">

<div id="ui">
    <div>Vidas: <span id="lives">3</span></div>
    <div>Rescatados: <span id="score">0</span></div>
</div>
<canvas id="rescueCanvas"></canvas>

<script>
const canvas = document.getElementById("rescueCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let lives = 3;
let gameOver = false;
let mouseY = canvas.height / 2;

const bubbles = Array.from({length: 40}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: 1 + Math.random() * 2,
    size: Math.random() * 5
}));

const entities = [];
const dolphin = { x: 100, y: canvas.height / 2, size: 60 };

// Seguimiento del ratón/toque
window.addEventListener("mousemove", e => mouseY = e.clientY);
window.addEventListener("touchmove", e => mouseY = e.touches[0].clientY);

function spawnEntity() {
    if (gameOver) return;
    if (Math.random() < 0.03) { // Frecuencia moderada
        const isGood = Math.random() > 0.4;
        entities.push({
            x: canvas.width + 50,
            y: 50 + Math.random() * (canvas.height - 100),
            type: isGood ? 'good' : 'bad',
            emoji: isGood ? ['🐢', '🐠', '🐟'][Math.floor(Math.random()*3)] : '🕸️',
            speed: 3 + Math.random() * 2
        });
    }
}

function update() {
    if (gameOver) return;

    // Movimiento suave del delfín (reacción de agua)
    dolphin.y += (mouseY - dolphin.y) * 0.1;

    // Burbujas
    bubbles.forEach(b => {
        b.x -= b.speed;
        if (b.x < -10) b.x = canvas.width + 10;
    });

    spawnEntity();

    entities.forEach((ent, i) => {
        ent.x -= ent.speed;

        // Colisión
        const dist = Math.hypot(dolphin.x - ent.x, dolphin.y - ent.y);
        if (dist < 50) {
            if (ent.type === 'good') {
                score++;
                document.getElementById("score").innerText = score;
            } else {
                lives--;
                document.getElementById("lives").innerText = lives;
                if (lives <= 0) endGame();
            }
            entities.splice(i, 1);
        }

        if (ent.x < -50) entities.splice(i, 1);
    });
}

function endGame() {
    gameOver = true;
    setTimeout(() => {
        alert("¡Misión cumplida! Rescataste a " + score + " animales.");
        location.reload();
    }, 100);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Burbujas
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // Delfín
    ctx.font = "60px Arial";
    ctx.textAlign = "center";
    ctx.fillText("🐬", dolphin.x, dolphin.y + 20);

    // Entidades
    entities.forEach(ent => {
        ctx.font = "45px Arial";
        ctx.fillText(ent.emoji, ent.x, ent.y + 15);
    });

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

draw();
</script>
</body>
</html>
