<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #0077be; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: pointer; }
        canvas { display: block; background: linear-gradient(#0093E9, #80D0C7); width: 100vw; height: 100vh; }
        #score { position: absolute; top: 15px; left: 15px; color: white; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body onclick="window.focus()">

<div id="score">Puntos: 0</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreElement = document.getElementById("score");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameOver = false;

// --- AJUSTES DE DIFICULTAD ---
const turtle = { 
    x: 60, 
    y: canvas.height / 2, 
    width: 45, 
    height: 30, 
    speed: 4.5 // Más lento y preciso
};

const obstacles = [];
const trashTypes = ['🥤', '🛍️', '🧴', '🥫'];
const keys = {};

window.addEventListener("keydown", e => {
    if(["ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
});
window.addEventListener("keyup", e => keys[e.code] = false);

function spawnObstacle() {
    // Probabilidad reducida para que haya menos basura (0.01 en vez de 0.02)
    if (Math.random() < 0.01) {
        obstacles.push({
            x: canvas.width,
            y: Math.random() * (canvas.height - 50),
            size: 30,
            emoji: trashTypes[Math.floor(Math.random() * trashTypes.length)],
            speed: 2 + Math.random() * 8 // Velocidad muy tranquila
        });
    }
}

function update() {
    if (gameOver) return;

    if (keys["ArrowUp"] && turtle.y > 10) turtle.y -= turtle.speed;
    if (keys["ArrowDown"] && turtle.y < canvas.height - 40) turtle.y += turtle.speed;

    spawnObstacle();

    obstacles.forEach((obs, i) => {
        obs.x -= obs.speed;

        // HITBOX REDUCIDA (Margen de error): 
        // El '10' y '-20' hacen que la tortuga deba tocar casi el centro para morir
        if (
            turtle.x + 10 < obs.x + obs.size - 10 && 
            turtle.x + turtle.width - 10 > obs.x + 10 &&
            turtle.y + 10 < obs.y + obs.size - 10 && 
            turtle.y + turtle.height - 10 > obs.y + 10
        ) {
            gameOver = true;
            setTimeout(() => {
                alert("¡Ánimo! La tortuga necesita otro intento. Puntos: " + score);
                location.reload();
            }, 100);
        }

        if (obs.x + obs.size < 0) {
            obstacles.splice(i, 1);
            score++;
            scoreElement.innerText = `Puntos: ${score}`;
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Dibujar Tortuga
    ctx.font = "45px Arial";
    ctx.fillText("🐢", turtle.x, turtle.y + 30);

    // Dibujar Basura
    obstacles.forEach(obs => {
        ctx.font = "32px Arial";
        ctx.fillText(obs.emoji, obs.x, obs.y + obs.size);
    });

    if (!gameOver) {
        requestAnimationFrame(draw);
        update();
    }
}

draw();
</script>
</body>
</html>
