<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #001219; font-family: 'Courier New', Courier, monospace; cursor: crosshair; }
        canvas { display: block; background: linear-gradient(#001219, #005f73); }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: #94d2bd; pointer-events: none; }
        .stat { margin: 0 20px; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body onclick="window.focus()">

<div id="ui">
    <span class="stat">Oxígeno: <span id="health">100</span>%</span>
    <span class="stat">Residuos: <span id="score">0</span></span>
</div>
<canvas id="oceanCanvas"></canvas>

<script>
const canvas = document.getElementById("oceanCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let health = 100;
let gameOver = false;
let mouseX = canvas.width / 2;

// Partículas de agua (efecto visual)
const particles = Array.from({length: 50}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: 0.5 + Math.random()
}));

const crab = { x: canvas.width / 2, y: canvas.height - 60, w: 60, h: 40 };
const items = [];
const trashEmojis = ['🧴', '🧤', '🚬', '🥤', '🕸️'];

// Control por ratón/movimiento
window.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
});

function createTrash() {
    if (Math.random() < 0.02) {
        items.push({
            x: Math.random() * canvas.width,
            y: -50,
            emoji: trashEmojis[Math.floor(Math.random() * trashEmojis.length)],
            speed: 1.5 + Math.random() * 2,
            drift: Math.sin(Math.random() * Math.PI) * 1 // Balanceo suave
        });
    }
}

function update() {
    if (gameOver) return;

    // Suavizado del movimiento del cangrejo (Lerp)
    crab.x += (mouseX - crab.x) * 0.1;

    // Limitar bordes
    if (crab.x < 30) crab.x = 30;
    if (crab.x > canvas.width - 30) crab.x = canvas.width - 30;

    // Actualizar basura
    items.forEach((item, i) => {
        item.y += item.speed;
        item.x += Math.sin(item.y / 50) * 0.5; // Efecto de corriente

        // Colisión con el cangrejo (recolectar)
        const dx = crab.x - item.x;
        const dy = crab.y - item.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 40) {
            items.splice(i, 1);
            score += 1;
            if(health < 100) health += 2;
            document.getElementById("score").innerText = score;
        } 
        // Si toca el fondo, resta salud (el mar se contamina)
        else if (item.y > canvas.height) {
            items.splice(i, 1);
            health -= 15;
            document.getElementById("health").innerText = Math.max(0, health);
            if (health <= 0) endGame();
        }
    });

    particles.forEach(p => {
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
    });

    createTrash();
}

function endGame() {
    gameOver = true;
    alert("¡El océano está demasiado contaminado! Limpiaste " + score + " residuos.");
    location.reload();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujar burbujas/partículas
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
    });

    // Dibujar Cangrejo
    ctx.font = "50px Arial";
    ctx.textAlign = "center";
    ctx.fillText("🦀", crab.x, crab.y);

    // Dibujar Basura
    items.forEach(item => {
        ctx.font = "30px Arial";
        ctx.fillText(item.emoji, item.x, item.y);
    });

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

draw();
</script>
</body>
</html>
